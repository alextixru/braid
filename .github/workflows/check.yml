# Проверка на каждый push и PR: `make check` — версия одна везде, fmt, clippy и
# тесты Rust (ядро, мост, сквозной тест), кросс-проверка платформенного кода под
# Linux/Windows/Android, go vet/test libawg, flutter analyze, dart format и тесты
# приложения, тесты вендоренного csqtt-core. Сборки .app и APK — в build.yml;
# он же вызывает этот workflow перед выпуском по тегу (workflow_call).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust, Go, Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, aarch64-linux-android

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
            engines/csqtt-core

      - name: Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: engines/awg-go/go.sum

      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Зависимости
        run: make setup-targets setup-flutter setup-go

      - name: make check
        run: make check
