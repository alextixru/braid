name: braid
description: "Braid — общий VPN-клиент: AWG + CSQTT к одному хосту, правила подпиской."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  braid_ffi:
    path: rust_builder
  desktop_webview_window: ^0.4.0
  ffi: ^2.2.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_secure_storage: ^10.3.4
  intl: ^0.20.3
  launch_at_startup: ^0.5.1
  mobile_scanner: ^7.4.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.6
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Копия ../THIRD_PARTY.md для экрана «О программе»; совпадение с оригиналом
    # проверяет test/about_third_party_test.dart.
    - assets/third_party.md
