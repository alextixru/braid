[package]
name = "braid-runtime"
description = "Сборка ядра для приложения: фабрика движков (AWG, CSQTT, null) и build_core(platform, storage_dir) — общий вход для моста Flutter и сервиса Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
build = "build.rs"
# Линкует braid-engine-csqtt → csqtt-core (PolyForm Noncommercial 1.0.0).
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
braid-core.workspace = true
braid-platform.workspace = true
braid-proto.workspace = true
braid-engine-awg = { path = "../braid-engine-awg" }
braid-engine-csqtt = { path = "../braid-engine-csqtt" }
tracing.workspace = true
# Подписчик logcat (`android::logcat_subscriber`): состав и политика уровней
# проверяются хостовым тестом, сам слой logcat — только под Android.
tracing-subscriber.workspace = true

# Android: JNI_OnLoad, мост ядра для сервиса VPN и слой logcat для tracing (src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
tracing-android = "0.2"

[dev-dependencies]
serde_json.workspace = true
# Сквозной тест (tests/e2e.rs, тикет 12): настоящий braid-subd в процессе на
# 127.0.0.1 — библиотечная часть сервера и tokio для его рантайма.
braid-subd = { path = "../braid-subd" }
tokio.workspace = true
