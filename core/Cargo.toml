# Workspace ядра Braid. Члены подхватываются по маске `braid*`:
# новый крейт (braid-engine-awg, braid-subd, braidctl, …) не требует правки этого файла.
# Версии общих зависимостей живут здесь; крейты подключают их через `workspace = true`.
[workspace]
resolver = "3"
members = ["braid*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/alextixru/braid"

[workspace.dependencies]
# внутренние крейты
braid-proto = { path = "braid-proto" }
braid-platform = { path = "braid-platform" }
braid-core = { path = "braid-core" }

# асинхронность и буферы
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
bytes = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1"
smallvec = "1"

# сериализация и форматы
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ipnet = { version = "2", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
base64 = "0.22"
hex = "0.4"
flate2 = "1"

# ошибки и логи
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# криптография и сеть
rand = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hickory-proto = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rcgen = "0.14"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "client-legacy", "http1"] }
http-body-util = "0.1"
http = "1"
socket2 = { version = "0.6", features = ["all"] }

# системные вызовы
libc = "0.2"
nix = { version = "0.31", features = ["socket", "uio", "fs", "poll", "net", "ioctl"] }
directories = "6"

# CLI и QR
clap = { version = "4", features = ["derive"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# платформы
jni = "0.22"                 # android
core-foundation = "0.10"     # macos
system-configuration = "0.8" # macos
